<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Feed - Real-Time AI Financial News & Market Insights</title>
    <meta name="description" content="Real-time, AI-analyzed financial news, market insights, stock updates, and economic forecasts.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1>📈 Finance Feed</h1>
            <p>Real-Time AI-Powered Market Insights & Intelligence</p>
        </div>
    </header>

    <!-- Kategori Filtreleme Barı -->
    <nav class="filter-nav container">
        <div id="filter-bar" class="filter-bar">
            <!-- Dinamik olarak script.js ile doldurulacak -->
            <button class="filter-btn active">ALL</button>
        </div>
    </nav>

    <main class="container">
        <section id="news-container" class="news-grid">
            <p class="loading-text">Loading latest market intelligence...</p>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Finance Feed. All rights reserved. Powered by Gemini AI.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
