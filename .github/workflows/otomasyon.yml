name: Finance News Automation

on:
  schedule:
    - cron: '0 */4 * * *' # Her 4 saatte bir otomatik çalışır
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme (Run workflow) butonu ekler

permissions:
  contents: write # Botun repoya "news.json" dosyasını kaydedebilmesi için gerekli izin

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Botu Çalıştır ve Yapay Zeka ile Haber Üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Secrets'taki anahtarı Python'a aktarır
        run: python bot.py

      - name: Yeni Haberleri Repoya Kaydet (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Oto-Güncelleme: Yapay Zeka Haberleri Eklendi" || echo "Değişiklik yok"
          git push
